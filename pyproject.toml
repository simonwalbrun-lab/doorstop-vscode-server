[project]
name = "doorstop-vscode-server"
dynamic = ["version"]
authors = [
  { name="Simon Walbrun" },
]
description = "FastAPI server wrapping the Doorstop Python API for the Doorstop VS Code extension"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]


dependencies = [
    "doorstop>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
build = ["build", "twine"]

[project.scripts]
doorstop-vscode-server = "doorstop_server.cli:main"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

[tool.pytest.ini_options]
testpaths = ["tests"]

license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/simonwalbrun-lab/doorstop-vscode-server"
Issues = "https://github.com/simonwalbrun-lab/doorstop-vscode-server/issues"