[project]
name = "doorstop-vscode-server"
dynamic = ["version"]
authors = [
  { name="Simon Walbrun" },
]
description = "FastAPI server wrapping the Doorstop Python API for the Doorstop VS Code extension"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]


dependencies = [
    "doorstop>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "pylint>=3"]
build = ["build", "twine"]

[project.scripts]
doorstop-vscode-server = "doorstop_server.cli:main"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    # Names and the spec references in comments document the code; docstrings
    # are written where they add something, not on every route and schema.
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # pytest fixtures are requested by parameter name, often only for their
    # effect, and FastAPI dependencies likewise (e.g. the shared tree refresh).
    "redefined-outer-name",
    "unused-argument",
]

[project.urls]
Homepage = "https://github.com/simonwalbrun-lab/doorstop-vscode-server"
Issues = "https://github.com/simonwalbrun-lab/doorstop-vscode-server/issues"